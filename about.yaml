label: About the Project
title: AI-Powered Mobile Manipulation for Airport Luggage Handling

# -------------

paragraphs:
  - Initiated and funded by **Dubai Future Foundation (DFF)** through the **Scale-Up Fund**, this
    collaborative project brings together DFF as the platform and hardware developer and **Khalifa
    University (KU)**, through the **Advanced Research and Innovation Center (ARIC)**, as the
    academic and research partner.
  - The project investigates **mobile manipulation** for loading, unloading and relocating airport
    luggage. A mobile robot combines navigation, perception and manipulation, with Multimodal Large
    Language Models (MLLMs) supporting high-level task interpretation and symbolic planning.
  - The collaboration brings together platform development and academic research in the UAE. Its
    focus is a research demonstrator for airport luggage handling, with capability validation and
    system integration progressing toward complete use cases.

# -------------

features:
  - id: luggage-handling
    title: Luggage Handling
    description:
      Loading luggage from conveyors into carts or Unit Load Devices (ULDs), unloading to
      arrival belts, and relocating luggage between handling areas.

  # -------------

  - id: multimodal-llm
    title: Multimodal LLM
