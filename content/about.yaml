label: About the Project
title: Intelligent Robotics for Modern Airports

# -------------

paragraphs:
  - This project, hosted at the **Advanced Research and Innovation Center (ARIC)** within Khalifa University,
    aims to fully automate common airport operations including luggage handling from check-in, conveyor
    belts, UMD processes, carts, and more.
  - At its core, a **central Multimodal Large Language Model (MLLM)** receives natural language task instructions
    from operators, processes contextual information about the robot's capabilities, sensor data, and environment
    state, then generates and executes high-level symbolic plans to accomplish complex airport tasks autonomously.
  - The robot platform is proudly developed and manufactured in the United Arab Emirates, reflecting the
    UAE's vision for local innovation and advanced technology development.

