name: Check and deploy website

# -------------

on:
  push:
  pull_request:
  workflow_dispatch:

# -------------

permissions:
  contents: read

# -------------

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# -------------

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      # -------------

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # -------------

      - run: npm ci

      # -------------

      - run: npm run lint

      # -------------

      - run: npm run format:check

      # -------------

      - run: npm run content:check

      # -------------

      - run: npm test

      # -------------

      - name: Read this repository's Pages URL
        id: pages
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      # -------------

      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      # -------------

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        with:
          path: dist

  # -------------

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to this repository's GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
