title: Picker 2.0

# -------------

image:
  path: assets/images/robot.png
  alt: Picker 2.0 mobile robot with a robotic arm mounted above its cargo platform

# -------------

paragraphs:
  - The **Picker 2.0** is the mobile manipulation platform developed by **Dubai Future Foundation
    (DFF)** for the project. It combines a mobile base, a robotic arm and a luggage support platform
    for research into airport luggage handling.
  - DFF leads platform and hardware development, while KU and ARIC contribute academic research on
    AI-Powered planning and robotic capabilities.

