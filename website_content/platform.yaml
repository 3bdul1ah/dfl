specifications: []

# -------------

tools:
  title: Custom End Tools and Transfer Modules
  items:
    - id: handler-mini
      title: Handler Mini
      description:
        Engages a suitcase handle and pulls or guides luggage from a baggage cart toward the
        transition module. The luggage remains supported by the cart or transfer module rather than
        relying on the arm to lift its full weight.
      status: in-development
      useCases:
        - Unloading

    # -------------

    - id: transition-module
      title: PICKER Transition Module
      description:
        Receives luggage extracted by the end tool, supports its weight and transfers it from
        the cart toward the main arrival conveyor. Slide, powered-conveyor and roller-plus-slide
        surfaces are being considered.
      status: in-development
      useCases:
        - Unloading

# -------------

roadmap:
  title: Planned Sensing Capabilities
  items:
    - id: tactile-sensing
      title: Tactile Sensing
      description: Planned integration to provide contact and slip feedback for adaptive luggage handling.
      status: planned

    # -------------

    - id: neuromorphic-vision
      title: Neuromorphic Vision
      description: A future sensing capability under consideration for the mobile manipulation system.
      status: planned
