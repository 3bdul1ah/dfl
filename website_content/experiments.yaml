# Categories render only when a matching experiment has image or video evidence.
# Add recordings to experiments; do not present target use cases as completed trials.
label: Demonstrations and Validation
title: Capability Validation

# -------------

experiments:
  - id: navigation
    title: Autonomous Navigation
    description:
      The Picker 2.0 platform navigating autonomously through a structured environment. The
      robot builds and maintains an occupancy map in real time, plans collision-free paths, and
      localizes itself using onboard LiDAR and odometry. This capability is a prerequisite for any
      airport deployment scenario.
    video:
      path: assets/videos/Navigation_Experiment.MOV
      types:
        - video/quicktime
        - video/mp4
    category: navigation

  # -------------

  - id: grasping-pick-place
    title: "Grasping Experiment: Pick & Place"
    description:
      Demonstration of the robot's ability to detect, localize, and grasp target objects
      using 6-DoF pose estimation. The manipulation pipeline integrates visual perception with
      optimal grasp planning to reliably pick luggage-type objects from unstructured surfaces.
    video:
      path: assets/videos/Grasping_Experiment_1.MP4
    category: manipulation

  # -------------

  - id: grasping-varied-objects
    title: "Grasping Experiment: Varied Objects"
    description:
      Testing grasping across objects of varying size, shape and weight. This recording
      documents manipulation capability; tactile feedback integration is a planned development.
    video:
      path: assets/videos/Grasping_Experiment_2.MP4
    category: manipulation

  # -------------

  - id: grasping-placement
    title: "Grasping Experiment: Placement Precision"
    description:
      Evaluating precise placement of grasped objects into designated target locations (e.g.,
      conveyor slots, carts). The robot uses visual confirmation and feedback from the Execution
      Manager to validate successful task completion and update the environment state.
    video:
      path: assets/videos/Grasping_Experiment_3.MP4
    category: manipulation

# -------------

paragraphs:
